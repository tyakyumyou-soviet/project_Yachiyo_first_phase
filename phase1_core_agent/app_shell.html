<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yachiyo Light</title>
  <style>
    :root {
      --bg: #101319;
      --panel: #181d27;
      --panel-soft: #202735;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f2f4f8;
      --muted: #aab2c3;
      --accent: #78d7ba;
      --accent-strong: #38b992;
      --user: #2b68d8;
      --assistant: #242d3d;
      --system: #151a23;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      background:
        linear-gradient(135deg, rgba(120, 215, 186, 0.12), transparent 32%),
        linear-gradient(180deg, #101319 0%, #151923 100%);
    }

    .app {
      width: min(960px, calc(100vw - 24px));
      min-height: calc(100dvh - 24px);
      margin: 12px auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: rgba(24, 29, 39, 0.95);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(280px, auto);
      gap: 14px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(170px, 260px) auto;
      gap: 10px;
      align-items: center;
      justify-content: end;
      min-width: 0;
    }

    .model-select,
    .status,
    button,
    textarea {
      font: inherit;
    }

    .model-select {
      width: 100%;
      min-height: 44px;
      color: var(--text);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .status {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #f2b35e;
    }

    .status-dot.ok {
      background: var(--accent-strong);
    }

    .log {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 14px;
      padding: 20px;
      overflow: auto;
    }

    .bubble-wrap {
      display: flex;
    }

    .bubble-wrap.user {
      justify-content: flex-end;
    }

    .bubble-wrap.assistant,
    .bubble-wrap.system {
      justify-content: flex-start;
    }

    .bubble {
      max-width: min(76ch, 86%);
      padding: 13px 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .bubble.user {
      color: #f8fbff;
      background: linear-gradient(180deg, #316fe0 0%, var(--user) 100%);
      border-bottom-right-radius: 6px;
    }

    .bubble.assistant {
      background: var(--assistant);
      border-bottom-left-radius: 6px;
    }

    .bubble.system {
      color: var(--muted);
      background: var(--system);
      font-size: 13px;
    }

    .composer {
      padding: 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }

    .composer-shell {
      display: grid;
      gap: 10px;
      padding: 12px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 82px;
      resize: vertical;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #8f99ad;
    }

    .composer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    button {
      min-width: 104px;
      min-height: 48px;
      padding: 10px 16px;
      color: #08120f;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #bdf4df);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    @media (max-width: 720px) {
      .app {
        width: 100vw;
        min-height: 100dvh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .topbar {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .controls {
        grid-template-columns: 1fr;
        justify-content: stretch;
      }

      .model-select,
      .status,
      #send {
        width: 100%;
      }

      .log {
        padding: 14px 12px;
      }

      .bubble {
        max-width: 94%;
      }

      .composer {
        padding: 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      .composer-row {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Yachiyo Light</h1>
        <p>Phase 1 local roleplay assistant</p>
      </div>
      <div class="controls">
        <select class="model-select" id="model-select" aria-label="Model"></select>
        <div class="status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">connecting</span>
        </div>
      </div>
    </header>

    <section class="log" id="log" aria-live="polite"></section>

    <footer class="composer">
      <div class="composer-shell">
        <textarea id="prompt" placeholder="メッセージを送信"></textarea>
        <div class="composer-row">
          <span class="hint">Enter to send / Shift+Enter for newline</span>
          <button id="send" type="button">Send</button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const logEl = document.getElementById("log");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const statusTextEl = document.getElementById("status-text");
    const statusDotEl = document.getElementById("status-dot");
    const modelSelectEl = document.getElementById("model-select");

    const SESSION_KEY = "yachiyo-phase1-session-id-v2";
    const LEGACY_WS_CHAT_ENDPOINT = "/ws/chat";
    let sessionId = loadSessionId() || createSessionId();
    let currentAssistantBubble = null;
    let currentAssistantRawText = "";
    let activeModelId = null;

    saveSessionId(sessionId);

    function loadSessionId() {
      try {
        return localStorage.getItem(SESSION_KEY);
      } catch (_) {
        return null;
      }
    }

    function saveSessionId(value) {
      try {
        localStorage.setItem(SESSION_KEY, value);
      } catch (_) {
        return;
      }
    }

    function createSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      const randomPart = Math.random().toString(36).slice(2);
      return `session-${Date.now().toString(36)}-${randomPart}`;
    }

    function setStatus(text, ok = false) {
      statusTextEl.textContent = text;
      statusDotEl.classList.toggle("ok", ok);
    }

    function appendBubble(kind, text) {
      const wrap = document.createElement("div");
      wrap.className = `bubble-wrap ${kind}`;
      const bubble = document.createElement("div");
      bubble.className = `bubble ${kind}`;
      bubble.textContent = text;
      wrap.appendChild(bubble);
      logEl.appendChild(wrap);
      logEl.scrollTop = logEl.scrollHeight;
      return bubble;
    }

    function clearLog() {
      logEl.innerHTML = "";
      currentAssistantBubble = null;
      currentAssistantRawText = "";
    }

    function sanitizeAssistantText(text) {
      return text
        .replace(/<\/?(?:emotion|motion|thinking|plan|tool|arg)\b[^>]*>/g, "")
        .replace(/\s*\((?=[^()\n]{3,180}\))(?=[^()\n]*[A-Za-z])[^()\n]*\)\s*/g, " ")
        .replace(/[ \t]{2,}/g, " ")
        .replace(/\n[ \t]+/g, "\n")
        .trim();
    }

    function renderSessionHistory(session) {
      clearLog();
      for (const message of session.history || []) {
        if (message.role === "user" || message.role === "assistant") {
          appendBubble(message.role, message.content);
        }
      }
    }

    function shouldUseCompleteChat() {
      const host = window.location.hostname;
      const isLocalHost = host === "localhost" || host === "127.0.0.1" || host === "::1";
      return !isLocalHost || !window.ReadableStream;
    }

    async function loadCurrentHistory() {
      try {
        const detailResponse = await fetch(`/sessions/${encodeURIComponent(sessionId)}`);
        if (!detailResponse.ok) return;
        const session = await detailResponse.json();
        sessionId = session.session_id;
        saveSessionId(sessionId);
        renderSessionHistory(session);
      } catch (_) {
        return;
      }
    }

    function renderModelOptions(models, activeModelIdValue) {
      modelSelectEl.innerHTML = "";
      for (const model of models) {
        const option = document.createElement("option");
        option.value = model.id;
        option.textContent = model.installed
          ? model.display_name
          : `${model.display_name} (not installed)`;
        option.selected = model.id === activeModelIdValue;
        modelSelectEl.appendChild(option);
      }
      activeModelId = activeModelIdValue;
    }

    async function refreshModels() {
      try {
        const response = await fetch("/models");
        const body = await response.json();
        renderModelOptions(body.models || [], body.active_model_id || null);
      } catch (_) {
        return;
      }
    }

    async function switchModel() {
      const nextModelId = modelSelectEl.value;
      if (!nextModelId || nextModelId === activeModelId) return;
      setStatus("switching model", false);
      const response = await fetch("/models/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model_id: nextModelId }),
      });
      if (!response.ok) {
        appendBubble("system", "Model switch failed.");
        await refreshModels();
        setStatus("ready", true);
        return;
      }
      const body = await response.json();
      activeModelId = body.active_model.id;
      setStatus("ready", true);
    }

    function handlePacket(packet) {
      if (packet.event_type === "text_chunk") {
        if (!currentAssistantBubble) {
          currentAssistantBubble = appendBubble("assistant", "");
          currentAssistantRawText = "";
        }
        currentAssistantRawText += String(packet.payload || "");
        currentAssistantBubble.textContent = sanitizeAssistantText(currentAssistantRawText);
        logEl.scrollTop = logEl.scrollHeight;
        return;
      }

      if (packet.event_type === "thinking_summary") {
        setStatus("thinking", true);
        return;
      }

      if (packet.event_type === "plan_summary") {
        setStatus("responding", true);
        return;
      }

      if (packet.event_type === "system_status") {
        setStatus(packet.payload.status || "status", packet.payload.status === "connected");
      }
    }

    async function sendPromptHttp() {
      const text = promptEl.value.trim();
      if (!text) return;

      appendBubble("user", text);
      currentAssistantBubble = null;
      currentAssistantRawText = "";
      promptEl.value = "";
      sendBtn.disabled = true;
      setStatus("sending", false);

      try {
        if (shouldUseCompleteChat()) {
          await sendPromptComplete(text);
          return;
        }

        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, session_id: sessionId }),
        });
        if (!response.ok || !response.body) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";

          for (const chunk of chunks) {
            for (const line of chunk.split("\n")) {
              if (!line.startsWith("data: ")) continue;
              handlePacket(JSON.parse(line.slice(6)));
            }
          }
        }
        setStatus("ready", true);
      } catch (error) {
        appendBubble("system", `send failed: ${String(error)}`);
        setStatus("send failed", false);
      } finally {
        sendBtn.disabled = false;
        promptEl.focus();
      }
    }

    async function sendPromptComplete(text) {
      const response = await fetch("/chat/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, session_id: sessionId }),
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const body = await response.json();
      for (const packet of body.packets || []) {
        handlePacket(packet);
      }
      setStatus("ready", true);
    }

    sendBtn.addEventListener("click", sendPromptHttp);
    modelSelectEl.addEventListener("change", switchModel);
    promptEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendPromptHttp();
      }
    });

    setStatus("ready", true);
    refreshModels();
    loadCurrentHistory();
  </script>
</body>
</html>
