<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yachiyo Chat</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182d;
      --panel-soft: #18213a;
      --panel-muted: #0f1526;
      --line: rgba(255, 255, 255, 0.08);
      --text: #edf2ff;
      --muted: #96a2c3;
      --accent: #7dd3fc;
      --assistant: #19233c;
      --user: #2563eb;
      --chip: rgba(255, 255, 255, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      background:
        radial-gradient(circle at top, rgba(125, 211, 252, 0.10), transparent 25%),
        linear-gradient(180deg, #0b1020 0%, #0d1324 100%);
    }
    .app {
      width: min(920px, calc(100vw - 24px));
      min-height: calc(100vh - 24px);
      margin: 12px auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: rgba(17, 24, 45, 0.92);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }
    .topbar {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(255, 255, 255, 0.02);
    }
    .brand {
      display: grid;
      gap: 4px;
    }
    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .brand p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .model-select {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      max-width: 220px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #f59e0b;
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.12);
    }
    .status-dot.ok {
      background: #22c55e;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.12);
    }
    .log {
      padding: 28px 22px;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 18%),
        transparent;
    }
    .bubble-wrap {
      display: flex;
    }
    .bubble-wrap.user {
      justify-content: flex-end;
    }
    .bubble-wrap.assistant,
    .bubble-wrap.system {
      justify-content: flex-start;
    }
    .bubble {
      max-width: min(78ch, 85%);
      padding: 14px 16px;
      border-radius: 20px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--line);
    }
    .bubble.user {
      background: linear-gradient(180deg, #2f6df6 0%, #1e56d5 100%);
      color: #f8fbff;
      border-bottom-right-radius: 8px;
      border-color: rgba(255, 255, 255, 0.08);
    }
    .bubble.assistant {
      background: var(--assistant);
      border-bottom-left-radius: 8px;
    }
    .bubble.system {
      background: var(--panel-muted);
      color: var(--muted);
      font-size: 13px;
    }
    .thinking {
      margin-top: -6px;
      padding-left: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .composer {
      padding: 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }
    .composer-shell {
      display: grid;
      gap: 12px;
      padding: 14px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    textarea {
      width: 100%;
      min-height: 76px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      line-height: 1.6;
    }
    textarea::placeholder {
      color: #7f8cb1;
    }
    .composer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      color: #08111f;
      cursor: pointer;
      background: linear-gradient(135deg, #7dd3fc, #bae6fd);
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    @media (max-width: 720px) {
      .app {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        border-radius: 0;
        border: 0;
      }
      .bubble {
        max-width: 92%;
      }
      .topbar {
        padding: 16px 18px;
      }
      .log {
        padding: 18px 14px;
      }
      .composer {
        padding: 12px;
      }
      .composer-row {
        align-items: flex-end;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Yachiyo</h1>
        <p>Chat</p>
      </div>
      <div class="topbar-right">
        <select class="model-select" id="model-select"></select>
        <div class="status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">connecting</span>
        </div>
      </div>
    </header>

    <section class="log" id="log"></section>

    <footer class="composer">
      <div class="composer-shell">
        <textarea id="prompt" placeholder="メッセージを送信"></textarea>
        <div class="composer-row">
          <span class="hint">Enterで送信 / Shift+Enterで改行</span>
          <button id="send" type="button">送信</button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const logEl = document.getElementById("log");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const statusTextEl = document.getElementById("status-text");
    const statusDotEl = document.getElementById("status-dot");
    const modelSelectEl = document.getElementById("model-select");

    const SESSION_KEY = "yachiyo-phase1-session-id";
    let sessionId = localStorage.getItem(SESSION_KEY) || crypto.randomUUID();
    let chatSocket = null;
    let currentAssistantBubble = null;
    let currentAssistantRawText = "";
    let currentThinkingEl = null;
    let currentPlanEl = null;
    let activeModelId = null;

    localStorage.setItem(SESSION_KEY, sessionId);

    function setStatus(text, ok = false) {
      statusTextEl.textContent = text;
      statusDotEl.classList.toggle("ok", ok);
    }

    function appendBubble(kind, text) {
      const wrap = document.createElement("div");
      wrap.className = `bubble-wrap ${kind}`;
      const bubble = document.createElement("div");
      bubble.className = `bubble ${kind}`;
      bubble.textContent = text;
      wrap.appendChild(bubble);
      logEl.appendChild(wrap);
      logEl.scrollTop = logEl.scrollHeight;
      return bubble;
    }

    function appendThinkingLine(text) {
      const div = document.createElement("div");
      div.className = "thinking";
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
      return div;
    }

    function clearLog() {
      logEl.innerHTML = "";
      currentAssistantBubble = null;
      currentAssistantRawText = "";
      currentThinkingEl = null;
      currentPlanEl = null;
    }

    function sanitizeAssistantText(text) {
      return text.replace(/<\/?(?:emotion|motion|thinking|plan|tool|arg)\b[^>]*>/g, "");
    }

    function renderSessionHistory(session) {
      clearLog();
      for (const message of session.history || []) {
        const role = message.role === "user" ? "user" : "assistant";
        appendBubble(role, message.content);
      }
    }

    async function loadLatestHistory() {
      try {
        const sessionsResponse = await fetch("/sessions");
        const sessionsBody = await sessionsResponse.json();
        const sessions = sessionsBody.sessions || [];
        const target = sessions.find((item) => item.session_id === sessionId) || sessions[sessions.length - 1];
        if (!target) return;

        const detailResponse = await fetch(`/sessions/${encodeURIComponent(target.session_id)}`);
        if (!detailResponse.ok) return;
        const session = await detailResponse.json();
        sessionId = session.session_id;
        localStorage.setItem(SESSION_KEY, sessionId);
        renderSessionHistory(session);
      } catch (_) {
        return;
      }
    }

    function renderModelOptions(models, activeModelIdValue) {
      modelSelectEl.innerHTML = "";
      for (const model of models) {
        const option = document.createElement("option");
        option.value = model.id;
        option.textContent = model.installed
          ? `${model.display_name}`
          : `${model.display_name} (not installed)`;
        option.selected = model.id === activeModelIdValue;
        modelSelectEl.appendChild(option);
      }
      activeModelId = activeModelIdValue;
    }

    async function refreshModels() {
      try {
        const response = await fetch("/models");
        const body = await response.json();
        renderModelOptions(body.models || [], body.active_model_id || null);
      } catch (_) {
        return;
      }
    }

    async function switchModel() {
      const nextModelId = modelSelectEl.value;
      if (!nextModelId || nextModelId === activeModelId) return;
      const response = await fetch("/models/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model_id: nextModelId }),
      });
      if (!response.ok) {
        appendThinkingLine("Model switch failed.");
        await refreshModels();
        return;
      }
      const body = await response.json();
      activeModelId = body.active_model.id;
      appendThinkingLine(`Model: ${body.active_model.display_name} に切り替えたよ。`);
      setStatus("ready", true);
    }

    function handlePacket(packet) {
      if (packet.event_type === "text_chunk") {
        if (!currentAssistantBubble) {
          currentAssistantBubble = appendBubble("assistant", "");
          currentAssistantRawText = "";
        }
        currentAssistantRawText += String(packet.payload || "");
        currentAssistantBubble.textContent = sanitizeAssistantText(currentAssistantRawText);
        logEl.scrollTop = logEl.scrollHeight;
        return;
      }

      if (packet.event_type === "thinking_summary") {
        if (!currentThinkingEl) {
          currentThinkingEl = appendThinkingLine("");
        }
        currentThinkingEl.textContent = `Thinking: ${packet.payload}`;
        return;
      }

      if (packet.event_type === "plan_summary") {
        if (!currentPlanEl) {
          currentPlanEl = appendThinkingLine("");
        }
        currentPlanEl.textContent = `Plan: ${packet.payload}`;
        return;
      }

      if (packet.event_type === "system_status") {
        const ok = packet.payload.status === "connected";
        setStatus(packet.payload.status, ok);
        return;
      }
    }

    function ensureSocket() {
      if (chatSocket && (chatSocket.readyState === WebSocket.OPEN || chatSocket.readyState === WebSocket.CONNECTING)) {
        return;
      }

      const protocol = location.protocol === "https:" ? "wss" : "ws";
      chatSocket = new WebSocket(`${protocol}://${location.host}/ws/chat`);

      chatSocket.addEventListener("open", () => {
        setStatus("ready", true);
      });

      chatSocket.addEventListener("message", (event) => {
        const packet = JSON.parse(event.data);
        handlePacket(packet);
      });

      chatSocket.addEventListener("close", () => {
        setStatus("reconnecting", false);
        setTimeout(ensureSocket, 800);
      });

      chatSocket.addEventListener("error", () => {
        setStatus("error", false);
      });
    }

    async function sendPrompt() {
      const text = promptEl.value.trim();
      if (!text) return;

      ensureSocket();
      if (!chatSocket || chatSocket.readyState !== WebSocket.OPEN) {
        setStatus("connecting", false);
        return;
      }

      appendBubble("user", text);
      currentAssistantBubble = null;
      currentAssistantRawText = "";
      currentThinkingEl = appendThinkingLine("Thinking: 入力を受け取ったよ。");
      currentPlanEl = appendThinkingLine("Plan: 応答を準備しているよ。");
      promptEl.value = "";
      sendBtn.disabled = true;

      try {
        chatSocket.send(JSON.stringify({ text, session_id: sessionId }));
      } catch (_) {
        setStatus("send failed", false);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendPrompt);
    modelSelectEl.addEventListener("change", switchModel);
    promptEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendPrompt();
      }
    });

    ensureSocket();
    refreshModels();
    loadLatestHistory();
  </script>
</body>
</html>
